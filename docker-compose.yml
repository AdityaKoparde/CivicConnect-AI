# ============================================================
# CivicConnect AI — full-stack deployment: PostgreSQL + Python AI
# + Node backend + web UI.
#
#   docker compose up --build
#   → UI:  http://localhost:8080  (nginx, same-origin /api)
#   → API: http://localhost:4000/api/health
#
# Breaks nothing out of the box: set JWT_SECRET / AI_SERVICE_KEY /
# POSTGRES_PASSWORD in a root .env before any real deployment, and
# change the seeded staff passwords (backend/prisma/seed.ts).
# ============================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicconnect}
      POSTGRES_DB: civicconnect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicconnect"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ai:
    build: ./ai-service
    environment:
      # Shared internal key; backend sends it as X-Service-Key
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-ccai-internal-service-key-demo}
      # "demo" = built-in offline rule/ML engine (default, no credentials).
      # "openai" = OpenAI-compatible API (needs OPENAI_API_KEY).
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_LLM_TIMEOUT_SECONDS: ${AI_LLM_TIMEOUT_SECONDS:-20}
      AI_GATEWAY_ENABLED: ${AI_GATEWAY_ENABLED:-false}
      AI_GATEWAY_FALLBACK_MODEL: ${AI_GATEWAY_FALLBACK_MODEL:-}
    expose:
      - "8000"
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-civicconnect}@db:5432/civicconnect?schema=public
      BACKEND_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-43200}
      # Public origin of the UI (CSRF allowlist + CORS). Change when you
      # serve the UI on another host/port, e.g. https://civic.example.org
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-ccai-internal-service-key-demo}
      UPLOAD_DIR: uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
